name: api-tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write      # advisory-шаг оставляет разбор комментарием в PR

concurrency:                # новый пуш в ветку отменяет прошлый прогон, а не копит очередь
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Сборка и API-тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Сборка всех модулей
        run: mvn -B -q -DskipTests package

      - name: Поднять сервис
        run: |
          nohup java -jar user-service/target/user-service-*.jar > service.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/users > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/api/users > /dev/null

      - name: API-тесты
        run: mvn -B -pl api-tests test

      - name: Лог сервиса при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-log
          path: service.log

      - name: Отчёт Surefire как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api-tests/target/surefire-reports/

  llm-report:
    name: LLM-разбор прогона (advisory)
    needs: tests
    if: always()
    continue-on-error: true          # шаг ничего не блокирует и не меняет статус сборки
    runs-on: self-hosted             # раннер рядом с Ollama: модель локальная, наружу ничего не уходит
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: surefire-reports
          path: api-tests/target/surefire-reports/

      - name: Собрать модуль triage
        run: mvn -B -q -pl triage -am -DskipTests package

      - name: Разбор отчёта моделью
        env:
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.1:8b     # версия модели пиннится: latest в CI не бывает
          TRIAGE_ENABLED: 'true'        # выключение шага одной переменной
        run: java -jar triage/target/triage.jar --input api-tests/target/surefire-reports

      - name: Разбор — комментарием в PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file triage/target/triage.md

      - name: Промпт и ответ модели — в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-artifacts
          path: |
            triage/target/triage-prompt.txt
            triage/target/triage-response.json
            triage/target/triage.md
